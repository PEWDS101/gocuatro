<section class="hero" id="top">
  <div class="hero__glow" aria-hidden="true">
    <span class="aur aur--1"></span>
    <span class="aur aur--2"></span>
  </div>

  <div class="shell hero__in">
    <p class="brow up" data-i18n="hero.eyebrow">Web design &amp; development studio</p>

    <h1 class="hero__h up" style="--w:.08s">
      <span class="hero__l1" data-i18n="hero.title1">Crafted</span>
      <span class="hero__l2" data-i18n="hero.title2">Not Assembled</span>
    </h1>

    <p class="hero__p up" style="--w:.18s" data-i18n="hero.text">
      We write every line of your website by hand — so it loads fast, reads clearly
      to search engines, and works on every screen your customers own.
    </p>

    <div class="hero__act up" style="--w:.26s">
      <a href="contact.html" class="btn btn--lg" data-i18n="hero.cta1">Start your project</a>
      <a href="services.html" class="btn btn--ghost btn--lg" data-i18n="hero.cta2">See what we do</a>
    </div>

    <figure class="editor up" style="--w:.36s">
      <figcaption class="editor__bar">
        <span class="editor__dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="editor__tabs" id="tabs" dir="ltr" aria-hidden="true">
          <span class="etab is-on">index.html</span>
          <span class="etab">style.css</span>
          <span class="etab">app.js</span>
        </span>
      </figcaption>

      <div class="editor__body">
        <div class="editor__code" id="code" dir="ltr" aria-hidden="true"></div>
        <p class="vh" data-i18n="editor.sr">A decorative animation of code being written.</p>
      </div>

      <ul class="editor__foot">
        <li data-i18n="hero.f1">Hand-written code</li>
        <li data-i18n="hero.f2">Zero dependencies</li>
        <li data-i18n="hero.f3">Three languages, RTL ready</li>
        <li data-i18n="hero.f4">Built for speed</li>
      </ul>
    </figure>
  </div>
</section>
